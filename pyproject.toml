[project]
name = "collusion"
version = "0.1.0"
description = "Graph-structural analysis of the OpenAI agent wiki collusion corpus"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.4",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "pyarrow>=17",
    "python-igraph>=0.11",
    "leidenalg>=0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collusion"]
